version: '3'

vars:
  SCRIPT_ARGS: '{{range .CLI_ARGS | splitArgs}} {{. | shellQuote}}{{end}}'

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  run:
    desc: Build and launch the Debug app (use -- --reset to clear the saved workspace selection)
    cmds:
      - ./script/build_and_run.sh{{.SCRIPT_ARGS}}

  mock:
    desc: Build the Debug app, open an isolated temporary Git workspace, and verify startup
    cmds:
      - ./script/build_and_run.sh --mock linked-worktree-selected{{.SCRIPT_ARGS}}

  verify:
    desc: Build the Debug app, verify startup, print its PID, and leave it running
    cmds:
      - ./script/build_and_run.sh --verify{{.SCRIPT_ARGS}}

  debug:
    desc: Build the Debug app and enter LLDB (type run to launch)
    interactive: true
    cmds:
      - ./script/build_and_run.sh --debug{{.SCRIPT_ARGS}}

  logs:
    desc: Build the Debug app, verify startup, and stream process logs for its PID
    cmds:
      - ./script/build_and_run.sh --logs{{.SCRIPT_ARGS}}

  telemetry:
    desc: Build the Debug app, verify startup, and stream MonoDeck subsystem logs for its PID
    cmds:
      - ./script/build_and_run.sh --telemetry{{.SCRIPT_ARGS}}

  quit:
    desc: Quit the specified MonoDeck instance gracefully and wait for it to exit (PID=<process-id>)
    requires:
      vars: [PID]
    cmds:
      - /usr/bin/swift -module-cache-path "${TMPDIR%/}/mono-deck-verification-module-cache" script/quit_app.swift {{.PID | shellQuote}}

  test:
    desc: Run unit tests in isolation and clean up afterward (filter with TEST_FILTER, fail if no tests run)
    silent: true
    cmds:
      - /usr/bin/python3 script/run_tests.py --filter {{.TEST_FILTER | default "MonoDeckTests" | shellQuote}} --{{.SCRIPT_ARGS}}

  package:
    desc: Build, verify, and package the arm64 release DMG, then open it after a local build
    cmds:
      - ./script/package_app.sh

  icon:previews:
    desc: Export the app icon in six native appearances (-- <output-directory>)
    cmds:
      - ./script/export_app_icon_previews.sh{{.SCRIPT_ARGS}}

  mock:cleanup:
    desc: Remove data for a mock instance that has exited or never launched (DIRECTORY=<temporary-directory>)
    requires:
      vars: [DIRECTORY]
    cmds:
      - /usr/bin/python3 script/prepare_mock_workspace.py cleanup --directory {{.DIRECTORY | shellQuote}}
